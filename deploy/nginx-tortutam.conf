# Plantilla de proxy inverso para TortuTAM en el VPS.
#
# Sirve el frontend estatico y la API bajo el MISMO dominio (frontend en "/",
# API en "/api/"), para no necesitar ninguna politica CORS en produccion.
#
# Instalacion en el servidor:
#   sudo cp deploy/nginx-tortutam.conf /etc/nginx/sites-available/tortutam
#   sudo ln -s /etc/nginx/sites-available/tortutam /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Reemplazar TU_DOMINIO.TLD por el dominio real antes de activar. El bloque
# HTTPS se completa con certbot (ver docs/despliegue-hostinger.md), que
# agrega sus propias lineas de certificado a este archivo.

server {
    listen 80;
    server_name TU_DOMINIO.TLD www.TU_DOMINIO.TLD;

    root /opt/tortutam/web;
    index index.html;

    location /api/ {
        proxy_pass         http://127.0.0.1:5034/api/;
        proxy_http_version 1.1;
        proxy_set_header    Host $host;
        proxy_set_header    X-Real-IP $remote_addr;
        proxy_set_header    X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
