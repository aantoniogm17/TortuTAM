# Corta cualquier peticion cuyo nombre de host no sea el del proyecto, para
# que otros dominios que apunten a este VPS (p. ej. prospectiva360.cloud) no
# terminen sirviendo TortuTAM por ser el primer server de nginx.
#
# Instalacion: ver nginx-tortutam.conf. Requiere que el certificado de
# datalora.prospectiva360.cloud ya exista (certbot). El bloque 443 usa ese
# certificado porque nginx 1.18 no soporta ssl_reject_handshake; quien entre
# por otro host recibe un aviso de certificado y luego la conexion se corta.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    return 444;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    ssl_certificate /etc/letsencrypt/live/datalora.prospectiva360.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/datalora.prospectiva360.cloud/privkey.pem;
    return 444;
}
